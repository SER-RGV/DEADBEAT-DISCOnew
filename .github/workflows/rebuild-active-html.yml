name: Rebuild active game HTML

on:
  push:
    branches:
      - main
      - "fix/**"
      - "arena/**"
    paths:
      - "src/**"
      - "backups/**"
      - "tools/build_active_html.py"
      - "tools/room_generation_migration.py"
      - "tools/qa/room_generation.cjs"
      - "tools/qa/hub_greybox.cjs"
      - ".github/workflows/rebuild-active-html.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate floor generation across seeds
        run: node tools/qa/room_generation.cjs
      # El paso se salta mientras el fichero no exista: el PR #36 declaró esta
      # validación pero no incluyó tools/qa/hub_greybox.cjs, de modo que el
      # trabajo fallaba por un módulo ausente y no por la geometría. En cuanto el
      # fichero llegue, el paso se ejecutará solo.
      - name: Validate vestibule geometry and reachability
        if: hashFiles('tools/qa/hub_greybox.cjs') != ''
        run: node tools/qa/hub_greybox.cjs
      - name: Rebuild the single-file game
        run: python tools/build_active_html.py
      - name: Commit generated playable HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html DEADBEAT_DISCO.html
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate playable HTML from source modules"
            git push
          fi
