<g font-family="sans-serif" fill="#e3edf0"><text x="705" y="100" font-size="21">LEYENDA / ALTURAS</text><text x="705" y="138" font-size="17">Cian: escenario y cabina DJ</text><text x="705" y="166" font-size="17">Escalera frontal única</text><text x="705" y="194" font-size="17">Oro: banda + aro empotrado</text><text x="705" y="222" font-size="17">Suelo continuo z = 0</text><text x="705" y="250" font-size="17">Escenario z ≈ 1; no son metros</text><text x="705" y="278" font-size="17">Violeta: balcones z ≈ 4</text><text x="705" y="306" font-size="17">Punteado: cerchas/pasarelas z ≈ 7</text><text x="705" y="334" font-size="17">Cian pequeño: altavoces</text><text x="705" y="362" font-size="17">Gris: soportes estructurales</text><text x="705" y="411" font-size="17">04 oblicua baja: izquierda trasera</text><text x="705" y="439" font-size="17">05 alta: atrás, mira al escenario</text><text x="705" y="467" font-size="17">06 baja: centro, cerca del aro</text><text x="705" y="515" font-size="16">Flechas: dirección, no campo de visión.</text><text x="705" y="543" font-size="16">Aro: detalle gráfico, no plataforma.</text><text x="705" y="571" font-size="16">Geometría hipotética, sin escala real.</text></g>
<text x="62" y="725" fill="#eac887" font-family="sans-serif" font-size="17">Entrada propuesta detrás de cámaras; equipos laterales y zonas de servicio fuera del eje.</text><text x="62" y="751" fill="#9db9c2" font-family="sans-serif" font-size="15">Concepto previo a la generación; no sustituye modelos, cámaras ni recursos de producción.</text></svg>
