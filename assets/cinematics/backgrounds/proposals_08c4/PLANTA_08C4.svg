<title id="title">08C4 · Planta única propuesta, no aprobada</title><desc id="desc">Planta conceptual del club: escenario norte, banda y aro a nivel de suelo, balcones, pasarelas, torres de sonido y tres posiciones de cámara distintas.</desc>
