<text x="35" y="35" font-family="sans-serif" font-size="23" fill="#e6ecf3">PLANTA · unidades proporcionales 0–100</text>
<text x="840" y="130" font-family="sans-serif" font-size="19" fill="#e6ecf3">LEYENDA</text>
<text x="840" y="170" font-family="sans-serif" font-size="15" fill="#e6ecf3">Oro: escenario / escalera / cabina</text>
<text x="840" y="200" font-family="sans-serif" font-size="15" fill="#e6ecf3">Cian: altavoces y luz</text>
<text x="840" y="230" font-family="sans-serif" font-size="15" fill="#e6ecf3">Violeta: balcones</text>
<text x="840" y="260" font-family="sans-serif" font-size="15" fill="#e6ecf3">Gris: columnas</text>
<text x="840" y="290" font-family="sans-serif" font-size="15" fill="#e6ecf3">Puntos amarillos: público fijo</text>
<text x="840" y="320" font-family="sans-serif" font-size="15" fill="#e6ecf3">Franja: patrón de suelo estimado</text>
<text x="840" y="350" font-family="sans-serif" font-size="15" fill="#e6ecf3">Rosa punteado: reserva futura</text>
<text x="840" y="380" font-family="sans-serif" font-size="15" fill="#e6ecf3">Puntos rosas: cámaras</text>
<text x="840" y="430" font-family="sans-serif" font-size="15" fill="#e6ecf3">Eje X: izquierda → derecha</text>
<text x="840" y="460" font-family="sans-serif" font-size="15" fill="#e6ecf3">Eje Y: acceso → escenario</text>
<text x="840" y="505" font-family="sans-serif" font-size="14" fill="#e6ecf3">No es plano físico ni escala del juego</text>
