<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../../../">
  <title>DEADBEAT DISCO · Reproductor de la intro</title>
  <link rel="stylesheet" href="src/dd_rebuild_ui.css">
  <style>
    :root { --dd-neon-cyan:#22d3ee; color-scheme:dark; }
    body { margin:0; background:#090412; color:#f8fafc; font:14px system-ui,sans-serif; }
    main { width:min(100%, 1280px); margin:auto; padding:16px; box-sizing:border-box; }
    h1 { font-size:20px; margin:0 0 6px; }
    p { color:#bec6d6; margin:0 0 12px; }
    #stage { position:relative; aspect-ratio:16/9; background:#06020c; overflow:hidden; }
    canvas { display:block; width:100%; height:100%; }
    #dd-cine-overlay { position:absolute; }
    #dd-cine-overlay .dd-letterbox-bar { height:clamp(32px,7%,64px); padding:0 14px; box-sizing:border-box; }
    #dd-cine-overlay .dd-letterbox-bar.bottom span:last-child { display:none; }
    .controls { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-top:12px; }
    button, a { color:#8eeaff; } button { background:#21132b; border:1px solid #22d3ee; border-radius:4px; padding:8px 14px; cursor:pointer; }
    #status { color:#f4d590; }
  </style>
</head>
<body>
<main>
  <h1>DEADBEAT DISCO · Intro</h1>
  <p>Reproduce el controlador real de la cinemática. Esta vista no inicia una partida ni representa el HUB o su audio.</p>
  <div id="stage"><canvas id="screen" width="1280" height="720" aria-label="Cinemática de introducción"></canvas></div>
  <div class="controls"><button id="replay" type="button">Reproducir de nuevo</button><button id="skip" type="button">Saltar</button><a href="assets/cinematics/preview/index.html">Galería de recursos</a><span id="status" role="status">Cargando recursos…</span></div>
</main>
<script src="src/dd_asset_registry.js"></script>
<script src="src/dd_cinematic_camera.js"></script>
<script src="assets/cinematics/preview/player.js"></script>
</body>
</html>
